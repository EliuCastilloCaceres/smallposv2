server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Comprobantes de gastos de hasta 5 MB (spec 12); el default de
        # Nginx es 1 MB y respondería 413 antes de llegar al backend
        client_max_body_size 6m;
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
    }
}