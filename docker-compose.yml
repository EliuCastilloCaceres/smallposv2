services:
  mysql:
    image: mysql:8.0
    container_name: smallpos_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smallposv2_prueba1
      MYSQL_USER: pos_user
      MYSQL_PASSWORD: pos_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql-init:/docker-entrypoint-initdb.d
    networks:
      - pos_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    container_name: smallpos_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
     - ./backend/.env
    environment:
       DB_HOST: mysql
       DB_PORT: 3306
       DB_USER: pos_user
       DB_PASSWORD: pos_password
    ports:
      - "3000:3001"
    networks:
      - pos_network
    volumes:
      - ./backend/public/images/products:/app/public/images/products
      - ./backend/public/images/receipts:/app/public/images/receipts

  frontend:
    build: ./frontend
    container_name: smallpos_frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    environment:
      VITE_BACKEND_URL: http://backend:3001
    ports:
      - "5371:5371"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - pos_network

volumes:
  mysql_data:

networks:
  pos_network:
    driver: bridge