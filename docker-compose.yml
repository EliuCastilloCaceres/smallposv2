services:
  mysql:
    image: mysql:8.0
    container_name: smallpos_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smallposv2_prueba1
      MYSQL_USER: pos_user
      MYSQL_PASSWORD: pos_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql-init:/docker-entrypoint-initdb.d
    networks:
      - pos_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    container_name: smallpos_backend
    restart: unless-stopped
    # Usa el script "dev" que ya existe en package.json (nodemon index.js),
    # solo le agrega --legacy-watch (polling) para que detecte cambios de
    # forma confiable a través del bind mount en Docker Desktop.
    command: npm run dev -- --legacy-watch
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
     - ./backend/.env
    environment:
       DB_HOST: mysql
       DB_PORT: 3306
       DB_USER: pos_user
       DB_PASSWORD: pos_password
    ports:
      - "3000:3001"
    networks:
      - pos_network
    volumes:
      # Todo el código fuente, para que nodemon vea los cambios al vuelo.
      # Esto ya incluye backend/public/images/{products,receipts}, así que
      # los dos mounts sueltos que apuntaban solo a esas subcarpetas quedaron
      # redundantes y se quitaron.
      - ./backend:/app
      # Volumen anónimo: protege node_modules (instalado DENTRO de la imagen
      # durante el build) de ser tapado por el mount de arriba. Sin esto, si
      # no existe (o está incompleto/desactualizado) un node_modules en tu
      # backend local, el contenedor se queda sin dependencias.
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: smallpos_frontend
    restart: unless-stopped
    # Sin "command:" — el CMD del dockerfile ya arranca en modo dev:
    # ["npm","run","dev","--","--host","0.0.0.0"]. No hace falta duplicarlo aquí.
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    environment:
      VITE_BACKEND_URL: http://backend:3001
      # Mismo motivo que --legacy-watch en el backend: el watcher de Vite
      # (chokidar) puede no detectar cambios de archivos montados vía bind
      # mount en Docker Desktop sin polling.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5371:5371"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - pos_network

volumes:
  mysql_data:

networks:
  pos_network:
    driver: bridge